apiVersion: apps/v1
kind: Deployment
metadata:
    name: converters
    namespace: docker
    labels:
        com.docker.compose.project: docker
        com.docker.compose.service: converters
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: docker
            com.docker.compose.service: converters
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: docker
